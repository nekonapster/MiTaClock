services:
  - type: web
    name: mita-clock
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MITA_MODE
        value: fake
      - key: ALLOW_DEMO_AUTH
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: CORRECTION_LOOKBACK_DAYS
        value: "7"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SEED_DEMO_PASSWORD
        sync: false
      - key: MITA_SYNC_KEY
        sync: false
